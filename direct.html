<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow34 - Educational Resources</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Inter, SF Pro Display, system-ui, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: radial-gradient(circle at top, #263b66, #050611 60%);
            color: white;
        }

        /* SPACE BACKGROUND */
        .space {
            position: absolute;
            inset: 0;
        }

        .stars {
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 45px 45px;
            opacity: .25;
            animation: drift 60s linear infinite;
        }

        @keyframes drift {
            from { transform: translateY(0); }
            to { transform: translateY(-300px); }
        }

        /* APP CONTAINER */
        .app {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .glass {
            background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,.15);
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }

        .resource-card {
            padding: 30px 25px;
            border-radius: 35px;
            animation: appear .8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(.95);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #fff, #9db8ff);
            -webkit-background-clip: text;
            color: transparent;
        }

        header p {
            margin: 8px 0 0 0;
            opacity: .7;
            font-size: 14px;
        }

        /* RESOURCE LINK LIST */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .resource-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.08);
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            transition: all .25s ease;
        }

        .resource-link:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,.2);
            border-color: rgba(255,255,255,.3);
        }

        .resource-link:active {
            transform: scale(.98);
        }

        .tag {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(120, 160, 255, 0.25);
            border: 1px solid rgba(120, 160, 255, 0.4);
            color: #d0e0ff;
        }

        @media(max-width:500px){
            .resource-card {
                padding: 20px;
            }
            header h1 {
                font-size: 28px;
            }
            .resource-link {
                padding: 14px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="space">
    <div class="stars"></div>
</div>

<main class="app">
    <section class="resource-card glass">
        <header>
            <h1>Study Resources</h1>
            <p>Meow34 Mathematics & English Material</p>
        </header>

        <nav class="link-list">
            <a href="/homework/W1206.html" class="resource-link">
                <span>Math Worksheet (W1206)</span>
                <span class="tag">Math</span>
            </a>

            <a href="./homework/W1144.html" class="resource-link">
                <span>Math Worksheet (W1144)</span>
                <span class="tag">Math</span>
            </a>

            <a href="./homework/PW1122.html" class="resource-link">
                <span>Practice Sheet (PW1122)</span>
                <span class="tag">Algebra</span>
            </a>

            <a href="./homework/Resent51.html" class="resource-link">
                <span>English Assignment (Resent51)</span>
                <span class="tag">English</span>
            </a>

            <a href="./homework/TBS.html" class="resource-link">
                <span>Study Guide (TBS)</span>
                <span class="tag">General</span>
            </a>

            <a href="./homework/Tuff14.html" class="resource-link">
                <span>Advanced Problems (Tuff14)</span>
                <span class="tag">Math</span>
            </a>

            <a href="./homework/WModern.html" class="resource-link">
                <span>Modern Worksheet</span>
                <span class="tag">Math</span>
            </a>
        </nav>
    </section>
</main>

</body>
</html>
