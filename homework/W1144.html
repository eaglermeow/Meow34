<style type="text/css">
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background-color: #0d1117;
			}

			.eagx_splash {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				width: 100%;
				height: 100%;
				box-sizing: border-box;
				overflow: hidden;
				display: flex;
				align-items: center;
				justify-content: center;
				background-color: #0d1117;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
				user-select: none;
				transition: opacity 0.45s ease;
			}

			.eagx_splash_hide {
				opacity: 0;
				pointer-events: none;
			}

			.eagx_splash_panel {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 16px;
				max-width: 92vw;
				text-align: center;
			}

			.eagx_logo {
				font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				font-size: clamp(24px, 5vw, 34px);
				font-weight: 600;
				color: #f0f6fc;
				letter-spacing: 0.5px;
			}

			.eagx_logo .slash {
				color: #8b949e;
				font-weight: 400;
				margin: 0 6px;
			}

			.eagx_subtitle {
				font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				font-size: 12px;
				color: #8b949e;
			}

			.eagx_loader {
				display: flex;
				align-items: center;
				gap: 9px;
				margin-top: 6px;
				font-size: 14px;
				color: #8b949e;
			}

			.eagx_spinner {
				width: 16px;
				height: 16px;
				flex: 0 0 auto;
				border: 2px solid rgba(88, 166, 255, 0.2);
				border-top-color: #58a6ff;
				border-radius: 50%;
				animation: eagx_spin 0.8s linear infinite;
			}

			@keyframes eagx_spin {
				to { transform: rotate(360deg); }
			}

			.eagx_dots span {
				opacity: 0;
				animation: eagx_dot_blink 1.3s infinite;
			}

			.eagx_dots span:nth-child(1) { animation-delay: 0s; }
			.eagx_dots span:nth-child(2) { animation-delay: 0.22s; }
			.eagx_dots span:nth-child(3) { animation-delay: 0.44s; }

			@keyframes eagx_dot_blink {
				0%, 60%, 100% { opacity: 0; }
				30% { opacity: 1; }
			}

			/* countdown (offline download) */
			.eagx_countdown_track {
				position: relative;
				width: min(360px, 68vw);
				height: 5px;
				overflow: hidden;
				border-radius: 3px;
				background: #21262d;
				border: 1px solid #30363d;
			}

			.eagx_countdown_track div {
				height: 100%;
				width: 0%;
				background: #58a6ff;
			}

			.eagx_btn {
				font-family: inherit;
				font-size: 12px;
				color: #f0f6fc;
				background: #21262d;
				border: 1px solid rgba(240, 246, 252, 0.1);
				border-radius: 6px;
				padding: 6px 14px;
				cursor: pointer;
				margin-top: 4px;
			}

			.eagx_countdown_note {
				font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				font-size: 11px;
				color: #8b949e;
				margin-top: 8px;
			}

			._eaglercraftX_press_any_key_image {
				display: flex !important;
				align-items: center !important;
				justify-content: center !important;
				background: #0d1117 !important;
				background-image: none !important;
				cursor: pointer;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
			}

			._eaglercraftX_press_any_key_image::before {
				content: "click to play";
				display: block;
				box-sizing: border-box;
				min-width: 280px;
				max-width: 74vw;
				padding: 18px 30px;
				font-size: 18px;
				font-weight: 500;
				text-align: center;
				color: #f0f6fc;
				background: #21262d;
				border: 1px solid #30363d;
				border-radius: 6px;
			}

			._eaglercraftX_press_any_key_image::after {
				content: "press any key or click anywhere to continue";
				position: absolute;
				left: 0;
				right: 0;
				bottom: 12%;
				text-align: center;
				font-size: 12px;
				color: #8b949e;
			}

			/* all ts for mobile!! */
			._eaglercraftX_mobile_press_any_key {
				background: #0d1117 !important;
				border-color: #30363d !important;
				border-width: 1px !important;
				border-radius: 6px !important;
				color: #c9d1d9 !important;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif !important;
			}

			._eaglercraftX_mobile_press_any_key h3 {
				color: #f0f6fc !important;
			}

			._eaglercraftX_mobile_launch_client {
				background: #238636 !important;
				color: #ffffff !important;
				border: 1px solid rgba(240, 246, 252, 0.1) !important;
				border-radius: 6px !important;
				padding: 8px 18px !important;
				font-family: inherit !important;
				font-weight: 500 !important;
				cursor: pointer;
			}
		</style>
		<script type="text/javascript">
			"use strict";
			window.__eagxSetStatus = function(txt) {
				var el = document.querySelector("#eagx_splash .eagx_status_text");
				if(el) el.textContent = txt;
			};
			window.__eagxHideSplash = function() {
				var el = document.getElementById("eagx_splash");
				if(!el) return;
				el.classList.add("eagx_splash_hide");
				setTimeout(function() {
					if(el.parentNode) el.parentNode.removeChild(el);
				}, 500);
			};
		</script>
	</head>
	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:#0d1117;" id="game_frame">
		<div style="margin:0px;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background-color:#0d1117;" id="launch_countdown_screen">
			<div class="eagx_splash_panel">
				<div class="eagx_logo">Worksheet</div>
				<div class="eagx_subtitle">worksheet 1.14.4</div>
				<div class="eagx_loader"><span class="eagx_spinner"></span><span class="eagx_countdown_text">Starting worksheet <span id="launchCountdownNumber">5</span>s</span></div>
				<div class="eagx_countdown_track"><div id="launchCountdownProgress"></div></div>
				<button id="skipCountdown" class="eagx_btn" autofocus>Load</button>
				<div class="eagx_countdown_note">this worksheet is maths department</div>
			</div>
		</div>
	</body>
</html>
